name: Full Sync
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  initial-sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run EUVD Sync and Commit
        id: sync
        run: |
          set -euo pipefail

          BEFORE_HASH=""
          if [ -f euvd_last_hash.txt ]; then
            BEFORE_HASH=$(cat euvd_last_hash.txt)
          fi

          python3 euvd_sync.py

          AFTER_HASH=""
          if [ -f euvd_last_hash.txt ]; then
            AFTER_HASH=$(cat euvd_last_hash.txt)
          fi

          if [ "$BEFORE_HASH" = "$AFTER_HASH" ]; then
            echo "euvd_last_hash.txt unchanged; skipping commit and deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync: EUVD advisory update"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Setup Pages
        if: steps.sync.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Remove unwanted root files
        if: steps.sync.outputs.changed == 'true'
        run: |
          rm -f ./*.py ./*.txt
          echo "VintHub - Not Found" > 404.html

      - name: Upload artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.sync.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
